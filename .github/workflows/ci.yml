# CI: PR / push に対して fmt・clippy・test を実行する。
# MSRV (rust-version) と最新 stable の双方で test を回し、
# 想定外の互換性退行を検出する。
#
# v0.3 cycle 1 から test job は services.postgis を立て、
# `SHPX_TEST_PG_URL` 環境変数経由で PostGIS integration テストを通す。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `proj` crate がシステム libproj を pkg-config で検出する（bundled_proj 未指定）。
      - run: sudo apt-get update && sudo apt-get install -y libproj-dev pkg-config
      # clippy warning ゼロを完了基準としているため -D warnings で失敗させる。
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # PostGIS driver の integration テストは GitHub Actions の services 機能で
    # postgis/postgis container を立てて localhost:5432 に publish する。
    # SHPX_TEST_PG_URL が無いテストは eprintln + return で skip する仕様なので、
    # env が設定されていればそのまま実 DB 接続テストが走る。
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shpx
          POSTGRES_PASSWORD: shpx
          POSTGRES_DB: shpx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shpx -d shpx_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # v0.4 cycle 1 から sqlserver driver の integration テストを通すため mssql
      # service を追加。MSSQL image は起動時にユーザ DB を作成しないため、
      # `Create shpx_test database` step で 1 度だけ CREATE DATABASE を発行する。
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Shpx_test_pw1!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Shpx_test_pw1! -C -Q 'SELECT 1' || exit 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      SHPX_TEST_PG_URL: pg://shpx:shpx@localhost:5432/shpx_test
      SHPX_TEST_SQLSERVER_URL: mssql://sa:Shpx_test_pw1!@localhost:1433/shpx_test
      # v0.5 cycle 1 から spatialite driver の integration テストを通す。
      # `libsqlite3-mod-spatialite` を apt で入れて、`load_extension` で動的ロード
      # できるようにする。env 未設定時は eprintln + return で skip する仕様。
      SHPX_TEST_SPATIALITE: "1"
      SHPX_SPATIALITE_PATH: /usr/lib/x86_64-linux-gnu/mod_spatialite
    strategy:
      fail-fast: false
      matrix:
        # MSRV と stable の双方で test を回す。
        toolchain: ["1.85", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # `proj` (システム libproj、pkg-config) と `mod_spatialite` (rusqlite::load_extension で
      # 動的ロード) の双方をインストール。test job 全体で共通利用する。
      - run: sudo apt-get update && sudo apt-get install -y libproj-dev pkg-config libsqlite3-mod-spatialite
      # mssql service は起動時に shpx_test DB を作成しないため、ここで明示的に
      # CREATE DATABASE を発行する。`-C` で TLS 証明書検証を無効化（self-signed のため）。
      # `IF DB_ID(...) IS NULL` で冪等にしているので、テスト失敗 → 再実行でも壊れない。
      - name: Create shpx_test database in mssql
        run: |
          docker exec ${{ job.services.mssql.id }} \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "Shpx_test_pw1!" -C \
            -Q "IF DB_ID('shpx_test') IS NULL CREATE DATABASE shpx_test"
      - run: cargo test --workspace --locked

  bundled-spatialite-smoke:
    # `bundled-spatialite` が「システム libspatialite 不在の cleanroom 環境」で build / test
    # を通せることを 3 OS で常時担保する。test job との差分は libsqlite3-mod-spatialite を
    # 入れない点で、bundled init 経路 (sqlite3_modspatialite_init を直接呼ぶ) が動くことを
    # 陰性対照として示す。Windows は GEOS C++ vendor build (MSVC + clang) のリンカ問題が
    # 出やすいため best-effort 扱い (continue-on-error: true)。docs/SPATIALITE.md サポート
    # OS 表 / ROADMAP.md v1.0 リスク節 参照。
    name: bundled-spatialite-smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            install-cmd: sudo apt-get update && sudo apt-get install -y cmake clang
          - label: macos-arm64
            os: macos-14
            install-cmd: brew install cmake
          - label: windows
            os: windows-latest
            # Why sqlite: proj-sys 0.25.0 (libproj 9.4) の cmake configure が
            # sqlite3.exe を PATH 上に要求する (proj.db を build 時に生成するため)。
            # Linux/macOS は apt/brew が `sqlite3` バイナリを同梱、Windows runner image
            # には libsqlite3 のみで .exe が無いため choco で別途入れる。
            install-cmd: choco install llvm sqlite -y --no-progress
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.install-cmd }}
      - run: cargo build -p shpx-cli --features bundled-spatialite --release
      - run: cargo test -p shpx-driver-spatialite --features bundled-spatialite
        env:
          SHPX_TEST_SPATIALITE: "1"
