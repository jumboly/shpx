# CI: PR / push に対して fmt・clippy・test を実行する。
# MSRV (rust-version) と最新 stable の双方で test を回し、
# 想定外の互換性退行を検出する。
#
# v0.3 cycle 1 から test job は services.postgis を立て、
# `SHPX_TEST_PG_URL` 環境変数経由で PostGIS integration テストを通す。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `proj` crate がシステム libproj を pkg-config で検出する（bundled_proj 未指定）。
      - run: sudo apt-get update && sudo apt-get install -y libproj-dev pkg-config
      # clippy warning ゼロを完了基準としているため -D warnings で失敗させる。
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # PostGIS driver の integration テストは GitHub Actions の services 機能で
    # postgis/postgis container を立てて localhost:5432 に publish する。
    # SHPX_TEST_PG_URL が無いテストは eprintln + return で skip する仕様なので、
    # env が設定されていればそのまま実 DB 接続テストが走る。
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shpx
          POSTGRES_PASSWORD: shpx
          POSTGRES_DB: shpx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shpx -d shpx_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SHPX_TEST_PG_URL: pg://shpx:shpx@localhost:5432/shpx_test
    strategy:
      fail-fast: false
      matrix:
        # MSRV と stable の双方で test を回す。
        toolchain: ["1.85", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libproj-dev pkg-config
      - run: cargo test --workspace --locked
