# SQL Server bench smoke. workflow_dispatch only.
# rows=10000000 で v0.4 完了基準 (chunk size 1M でも tempdb 溢れなし) を確認する。
# ogr2ogr との比較は GDAL Parquet plugin の CI 整備コスト (ubuntugis PPA / launchpad API)
# に見合わないため、shpx 単独の wall-clock 計測 + 完走 (= tempdb 溢れなし) のみを取る。
name: bench-smoke-mssql

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Bench input row count (smoke は数万〜10 万、リリース計測は 10000000)"
        required: false
        default: "100000"
      runs:
        description: "Number of repetitions (median wins)"
        required: false
        default: "3"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Shpx_test_pw1!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Shpx_test_pw1! -C -Q 'SELECT 1' || exit 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      SHPX_TEST_SQLSERVER_URL: mssql://sa:Shpx_test_pw1!@localhost:1433/shpx_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install proj
        run: sudo apt-get install -y libproj-dev pkg-config

      - name: Create shpx_test database in mssql
        run: |
          set -euxo pipefail
          docker exec ${{ job.services.mssql.id }} \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "Shpx_test_pw1!" -C \
            -Q "IF DB_ID('shpx_test') IS NULL CREATE DATABASE shpx_test"

      - name: Generate input parquet
        env:
          SHPX_BENCH_ROWS: ${{ github.event.inputs.rows }}
        run: |
          set -euxo pipefail
          # criterion harness の `ensure_parquet` で `target/bench-data/points_mssql_<rows>.parquet`
          # を生成する。--quick で計測自体は短時間で打ち切る (ベンチ目的では使わない)。
          cargo bench -q -p shpx-driver-sqlserver --bench bulk_insert -- \
            --quick --warm-up-time 1 --measurement-time 1 || true
          test -f "target/bench-data/points_mssql_${SHPX_BENCH_ROWS}.parquet"

      - name: Run shpx bench (staging bulk)
        env:
          SHPX_BENCH_ROWS: ${{ github.event.inputs.rows }}
          SHPX_MSSQL_BULK_CHUNK: "1000000"
        run: |
          set -euxo pipefail
          INPUT="target/bench-data/points_mssql_${SHPX_BENCH_ROWS}.parquet"
          SHPX_BIN="target/release/shpx"
          if [ ! -x "$SHPX_BIN" ]; then
            cargo build --release -p shpx-cli --locked
          fi
          mkdir -p target/bench-data
          {
            echo "==> rows=${SHPX_BENCH_ROWS}, runs=${{ github.event.inputs.runs }}, chunk=${SHPX_MSSQL_BULK_CHUNK}"
            for i in $(seq 1 ${{ github.event.inputs.runs }}); do
              # `--create-table=always` が DROP→CREATE するので前段の手動 DROP は不要。
              t=$(/usr/bin/time -p "$SHPX_BIN" convert \
                  --insert-mode=bulk \
                  --create-table=always \
                  --create-index=auto \
                  "$INPUT" \
                  "${SHPX_TEST_SQLSERVER_URL}?table=bench_shpx" \
                2>&1 | awk '/^real/ {print $2}')
              echo "  shpx run $i: ${t}s"
            done
          } | tee target/bench-data/bench-output.txt

      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: target/bench-data/bench-output.txt
          retention-days: 30
          if-no-files-found: warn
