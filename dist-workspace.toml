[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax). 5 triples × 3 OS。
# libspatialite は bundle しない (ADR-0006)。proj-sys (cmake + sqlite3.exe) のみが
# Windows MSVC build の関門で、これは検証済み。SpatiaLite 機能を使うユーザーには各 OS の
# package manager で `mod_spatialite` を別途 install してもらう運用 (`docs/SPATIALITE.md` 参照)。
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# cargo-dist 0.4+ で追加された設定。default true (= Rust 側に `+crt-static` を注入) のままだと
# proj-sys 0.25.0 の cmake build (Windows MSVC で `/MD` = MultiThreadedDLL がデフォルト) と
# C runtime が衝突し、`__imp_hypot` 等 31 件の LNK2019 unresolved external で release build が
# 失敗する (libcmt.lib vs ucrt dllimport の混在)。Rust 側を /MD 相当に倒すことで proj-sys と
# 整合させる。利用者環境の vcruntime140.dll は rustup 環境では既存、Windows 10+ の ucrt は
# OS 同梱のため追加 redist 配布は不要 (axodotdev/cargo-dist#496 / georust/proj#192 参照)。
msvc-crt-static = false
# Note: 配布対象 shpx-cli の有効化 feature (`bundled-proj`) は
# `crates/shpx-cli/Cargo.toml` の `[package.metadata.dist].features` で宣言する
# (cargo-dist 0.31 は workspace 側の `features` を読まないため)。

# bundled-proj build に必要な system dep を OS 別に宣言する。release.yml の build matrix
# が各 runner で自動 install する。
#
# - cmake: proj-sys 0.25 (libproj 9.4) の C ソース vendor build に必須
# - sqlite (Windows): proj-sys の cmake configure が sqlite3.exe を PATH 上に要求する
#   (proj.db を build 時に SQL から生成するため)。Linux apt と macOS Homebrew は
#   `sqlite3` binary を package に同梱するが、Windows runner image には libsqlite3 のみで
#   .exe が無いため choco で別途入れる。
# libspatialite は bundle しない (ADR-0006) ため、GEOS C++ build 用の clang / llvm は不要。
[dist.dependencies.apt]
cmake = '*'

[dist.dependencies.homebrew]
cmake = '*'

[dist.dependencies.chocolatey]
sqlite = '*'
