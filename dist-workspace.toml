[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Note: 配布対象 shpx-cli の `bundled-spatialite` feature は
# `crates/shpx-cli/Cargo.toml` の `[package.metadata.dist].features` で宣言する
# (cargo-dist 0.31 は workspace 側の `features` を読まないため)。

# bundled-spatialite build に必要な system dep を OS 別に宣言する。release.yml の
# build matrix が各 runner で自動 install する。CI smoke job (`.github/workflows/ci.yml`)
# も対応する choco/brew/apt コマンドを matrix.install-cmd で並走させる。
#
# - cmake / clang: GEOS の C++ vendor build (geos-src 0.2 経由) に必須
# - sqlite (Windows): proj-sys 0.25 (libproj 9.4) の cmake configure が sqlite3.exe を
#   PATH 上に要求する。Linux apt と macOS Homebrew は sqlite3 binary を同梱するが、
#   Windows runner image には libsqlite3 のみで .exe が無いため choco で別途入れる。
[dist.dependencies.apt]
cmake = '*'
clang = '*'

[dist.dependencies.homebrew]
cmake = '*'

[dist.dependencies.chocolatey]
llvm = '*'
sqlite = '*'
