[package]
name = "shpx-driver-fgb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shpx 用 FlatGeobuf (.fgb) ドライバ"

[lints]
workspace = true

[dependencies]
shpx-core    = { path = "../shpx-core" }
shpx-geom    = { path = "../shpx-geom" }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
chrono       = { workspace = true }
flatgeobuf   = { workspace = true }
# geozero は flatgeobuf の必須依存で、reader/writer の `FeatureProcessor` /
# `GeozeroDatasource` インタフェースを通すために shpx 側でも直接利用する。
# `with-wkb` feature を有効化して `WkbReader` / `WkbWriter` を使えるようにする。
geozero      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
tempfile           = { workspace = true }
tracing-subscriber = { workspace = true }
