[package]
name = "shpx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shpx CLI（convert / info サブコマンド）"

[lints]
workspace = true

# `cargo-dist` で配布する単一バイナリ用に、libproj を bundled でビルドさせる。
# default ビルドはシステム libproj を pkg-config で検出するため、cmake / clang 不要。
[features]
default       = []
bundled-proj  = ["shpx-geom/bundled-proj"]
# v0.5 で SpatiaLite driver の bundled-spatialite feature を CLI から伝播させる。
# 実装は v0.5 cycle 2 (現状は枠組みのみで、有効化してもシステム libspatialite を見る挙動)。
bundled-spatialite = ["shpx-driver-spatialite/bundled-spatialite"]

# CLI バイナリ名は `shpx`。crate 名と分けることでパッケージ名衝突を避ける。
[[bin]]
name = "shpx"
path = "src/main.rs"

[dependencies]
shpx-core           = { path = "../shpx-core" }
shpx-driver-shp     = { path = "../shpx-driver-shp" }
shpx-driver-parquet = { path = "../shpx-driver-parquet" }
shpx-driver-csv     = { path = "../shpx-driver-csv" }
shpx-driver-fgb     = { path = "../shpx-driver-fgb" }
shpx-driver-geojson = { path = "../shpx-driver-geojson" }
shpx-driver-gpkg    = { path = "../shpx-driver-gpkg" }
shpx-driver-postgis = { path = "../shpx-driver-postgis" }
shpx-driver-sqlserver = { path = "../shpx-driver-sqlserver" }
shpx-driver-spatialite = { path = "../shpx-driver-spatialite" }
shpx-geom           = { path = "../shpx-geom" }
arrow-schema        = { workspace = true }
clap                = { workspace = true }
serde_json          = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

[dev-dependencies]
shpx-geom    = { path = "../shpx-geom" }
assert_cmd   = { workspace = true }
predicates   = { workspace = true }
tempfile     = { workspace = true }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
parquet      = { workspace = true }
serde_json   = { workspace = true }
