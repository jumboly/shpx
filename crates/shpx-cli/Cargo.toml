[package]
name = "shpx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shpx CLI（convert / info サブコマンド）"

[lints]
workspace = true

# `cargo-dist` で配布する単一バイナリ用に、libproj を bundled でビルドさせる。
# default ビルドはシステム libproj を pkg-config で検出するため、cmake / clang 不要。
[features]
default       = []
bundled-proj  = ["shpx-geom/bundled-proj"]
# SpatiaLite driver の bundled-spatialite feature を CLI から伝播させる。
# v0.6 cycle 3 で libspatialite が PROJ を要求するようになったため、`bundled-proj`
# を CLI レイヤでも明示的に implies する (driver 側でも implies しているが、ROADMAP
# の宣言意図を CLI feature 表面で見えるようにするための保険)。
bundled-spatialite = [
    "shpx-driver-spatialite/bundled-spatialite",
    "shpx-geom/bundled-proj",
]
# SQL Server driver の Windows 認証 (integrated / NTLM) を CLI から伝播。
# Windows: pure Rust の tiberius `winauth` 経路。Linux/macOS: tiberius
# `integrated-auth-gssapi` 経路で system libgssapi-krb5 を要求するため、
# CLI レベルでも opt-in 限定。`shpx convert mssql://...?auth=integrated`
# で利用。
windows-auth = ["shpx-driver-sqlserver/windows-auth"]

# CLI バイナリ名は `shpx`。crate 名と分けることでパッケージ名衝突を避ける。
[[bin]]
name = "shpx"
path = "src/main.rs"

# v1.0 cycle 4: cargo-dist (`dist 0.31`) の Release build に有効化する shpx-cli
# の cargo feature。`bundled-spatialite` は driver の bundled-spatialite と
# shpx-geom/bundled-proj を implies するため、libspatialite / GEOS / libproj /
# SQLite を全て C ソースから static link した単一バイナリになる。配布先ホストへの
# system dep install を不要にするのが配布フェーズの主目的。dist-workspace.toml
# 側の `[dist] features` は cargo-dist 0.31 では package metadata 側を見るので、
# こちらを真の source of truth にする。
[package.metadata.dist]
features = ["bundled-spatialite"]

[dependencies]
shpx-core           = { path = "../shpx-core" }
shpx-driver-shp     = { path = "../shpx-driver-shp" }
shpx-driver-parquet = { path = "../shpx-driver-parquet" }
shpx-driver-csv     = { path = "../shpx-driver-csv" }
shpx-driver-fgb     = { path = "../shpx-driver-fgb" }
shpx-driver-geojson = { path = "../shpx-driver-geojson" }
shpx-driver-gpkg    = { path = "../shpx-driver-gpkg" }
shpx-driver-postgis = { path = "../shpx-driver-postgis" }
shpx-driver-sqlserver = { path = "../shpx-driver-sqlserver" }
shpx-driver-spatialite = { path = "../shpx-driver-spatialite" }
shpx-geom           = { path = "../shpx-geom" }
arrow-schema        = { workspace = true }
clap                = { workspace = true }
indicatif           = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

[dev-dependencies]
shpx-geom    = { path = "../shpx-geom" }
assert_cmd   = { workspace = true }
predicates   = { workspace = true }
tempfile     = { workspace = true }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
parquet      = { workspace = true }
serde_json   = { workspace = true }
