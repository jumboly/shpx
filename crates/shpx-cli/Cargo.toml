[package]
name = "shpx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shpx CLI（convert / info サブコマンド）"

[lints]
workspace = true

# CLI バイナリ名は `shpx`。crate 名と分けることでパッケージ名衝突を避ける。
[[bin]]
name = "shpx"
path = "src/main.rs"

[dependencies]
shpx-core           = { path = "../shpx-core" }
shpx-driver-shp     = { path = "../shpx-driver-shp" }
shpx-driver-parquet = { path = "../shpx-driver-parquet" }
shpx-driver-csv     = { path = "../shpx-driver-csv" }
arrow-schema        = { workspace = true }
clap                = { workspace = true }
serde_json          = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

[dev-dependencies]
shpx-geom    = { path = "../shpx-geom" }
assert_cmd   = { workspace = true }
predicates   = { workspace = true }
tempfile     = { workspace = true }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
serde_json   = { workspace = true }
