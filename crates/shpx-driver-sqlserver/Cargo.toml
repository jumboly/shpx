[package]
name = "shpx-driver-sqlserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shpx 用 SQL Server (Microsoft SQL Server / Azure SQL) ドライバ"

[lints]
workspace = true

[features]
# Windows 認証 (integrated / NTLM)。default off の理由:
#   - Windows: tiberius `winauth` は pure Rust で系外依存なし (cost ほぼゼロ) だが
#     Linux/macOS で同じ feature 名を有効にすると tiberius が `integrated-auth-gssapi`
#     経由で **system libgssapi-krb5 を要求** する。shpx の "single binary + system
#     dep zero" 哲学を保つため、利用者が自覚的に opt-in した時のみ有効化する。
#   - tiberius の cfg は OS で自動分岐するので、ここでは有効化トグルを 1 個だけ持つ。
windows-auth = ["tiberius/winauth", "tiberius/integrated-auth-gssapi"]

[dependencies]
shpx-core       = { path = "../shpx-core" }
shpx-geom       = { path = "../shpx-geom" }
shpx-rdb-common = { path = "../shpx-rdb-common" }
arrow-array    = { workspace = true }
arrow-schema   = { workspace = true }
chrono         = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }
tiberius       = { workspace = true }
rust_decimal   = { workspace = true }
uuid           = { workspace = true }
futures-util   = { workspace = true }
tracing        = { workspace = true }
bytes          = { workspace = true }

[dev-dependencies]
shpx-driver-shp     = { path = "../shpx-driver-shp" }
shpx-driver-parquet = { path = "../shpx-driver-parquet" }
tempfile            = { workspace = true }
tracing-subscriber  = { workspace = true }
# `harness=false` で criterion main を直接使うため default-features は不要
# (`html_reports` の plotters 依存を切ってビルド時間を節約)。
criterion           = { version = "0.5", default-features = false }
tiberius            = { workspace = true }

[[bench]]
name    = "bulk_insert"
harness = false
