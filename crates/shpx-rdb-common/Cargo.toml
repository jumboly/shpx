[package]
name = "shpx-rdb-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shpx の RDB driver (PostGIS / SQL Server / 将来 MySQL 等) で共有するヘルパー"

[lints]
workspace = true

[dependencies]
shpx-core    = { path = "../shpx-core" }
arrow-array  = { workspace = true }
tracing      = { workspace = true }
# v0.8 cycle 2 で SQLite 系 driver (GPKG / SpatiaLite) の rowid keyset pagination
# iterator を提供するため。`bundled` を有効化しないと shpx-rdb-common 単体で
# `cargo test -p shpx-rdb-common` が libsqlite3 不在環境で失敗するため bundled に倒す
# (driver crate も同 feature を使うため feature unification で重複ビルドにならない)。
rusqlite     = { workspace = true, features = ["bundled"] }
