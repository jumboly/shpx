[package]
name = "shpx-rdb-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shpx の RDB driver (PostGIS / SQL Server / 将来 MySQL 等) で共有するヘルパー"

[lints]
workspace = true

[dependencies]
shpx-core    = { path = "../shpx-core" }
arrow-array  = { workspace = true }
tracing      = { workspace = true }
# SQLite 系 driver (GPKG / SpatiaLite) と共有する rowid keyset pagination iterator
# (`streaming.rs::KeysetRowsIter`) のため。`bundled` を有効化しないと
# `cargo test -p shpx-rdb-common` 単体実行が libsqlite3 不在環境で失敗する
# (driver crate も同 feature を使うため feature unification で重複ビルドにならない)。
rusqlite     = { workspace = true, features = ["bundled"] }
