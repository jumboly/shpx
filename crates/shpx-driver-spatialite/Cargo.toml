[package]
name = "shpx-driver-spatialite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shpx 用 SpatiaLite (sqlite://) ドライバ"

[lints]
workspace = true

[dependencies]
shpx-core       = { path = "../shpx-core" }
shpx-geom       = { path = "../shpx-geom" }
shpx-rdb-common = { path = "../shpx-rdb-common" }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
chrono       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
# `bundled` で SQLite をソースから同梱ビルドする (GPKG driver と同方針)。
# `load_extension` で mod_spatialite を runtime ロードする (ADR-0006: libspatialite は
# bundle せず、ユーザーが用意した mod_spatialite を runtime ロードするのが唯一の経路)。
# `blob` / `chrono` は GPKG driver と同じく値 bind を simplify するため。
rusqlite     = { workspace = true, features = ["bundled", "blob", "chrono", "load_extension"] }

[dev-dependencies]
tempfile           = { workspace = true }
tracing-subscriber = { workspace = true }
# 完了基準テスト (cross-driver e2e roundtrip) 用。SpatiaLite ↔ GPKG / Shapefile を
# 直接呼び出して RecordBatch 比較するため、driver crate を dev-deps として参照する。
shpx-driver-gpkg = { path = "../shpx-driver-gpkg" }
shpx-driver-shp  = { path = "../shpx-driver-shp" }
