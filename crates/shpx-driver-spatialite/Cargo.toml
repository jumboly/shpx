[package]
name = "shpx-driver-spatialite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "shpx 用 SpatiaLite (sqlite://) ドライバ"
build = "build.rs"

[lints]
workspace = true

[features]
# 配布バイナリ (cargo-dist) 用に libspatialite を vendor から `cc` で static link する。
# 詳細スコープと cycle 構成は build.rs / docs/ROADMAP.md の v0.6 セクション参照。
bundled-spatialite = []

[dependencies]
shpx-core       = { path = "../shpx-core" }
shpx-geom       = { path = "../shpx-geom" }
shpx-rdb-common = { path = "../shpx-rdb-common" }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
chrono       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
# `bundled` で SQLite をソースから同梱ビルドする (GPKG driver と同方針)。
# `load_extension` で mod_spatialite を runtime ロードする。
# `blob` / `chrono` は GPKG driver と同じく値 bind を simplify するため。
rusqlite     = { workspace = true, features = ["bundled", "blob", "chrono", "load_extension"] }
# build.rs が `DEP_SQLITE3_INCLUDE` (Cargo の `links = "sqlite3"` 伝搬) を読むため
# rusqlite 経由ではなく direct dep として再宣言する (DEP_* env は直接依存にのみ渡る)。
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
tempfile           = { workspace = true }
tracing-subscriber = { workspace = true }
# 完了基準テスト (cross-driver e2e roundtrip) 用。SpatiaLite ↔ GPKG / Shapefile を
# 直接呼び出して RecordBatch 比較するため、driver crate を dev-deps として参照する。
shpx-driver-gpkg = { path = "../shpx-driver-gpkg" }
shpx-driver-shp  = { path = "../shpx-driver-shp" }
