# shpx ワークスペース定義
#
# 各ドライバとコアを 1 つの cargo workspace でまとめる。
# 設計詳細は docs/DESIGN.md を参照。

[workspace]
resolver = "2"
members = [
    "crates/shpx-core",
    "crates/shpx-geom",
    "crates/shpx-rdb-common",
    "crates/shpx-driver-shp",
    "crates/shpx-driver-parquet",
    "crates/shpx-driver-csv",
    "crates/shpx-driver-geojson",
    "crates/shpx-driver-gpkg",
    "crates/shpx-driver-fgb",
    "crates/shpx-driver-postgis",
    "crates/shpx-driver-sqlserver",
    "crates/shpx-driver-spatialite",
    "crates/shpx-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
# MSRV。CI でこのバージョンと最新 stable の双方を検証する。
# flatgeobuf 6.0 (FGB ドライバが依存) が `rust-version = 1.85` を要求するため、
# v0.2 cycle 4 で 1.79 → 1.85 に引き上げ。
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jumboly/shpx"
authors = ["shpx contributors"]

[workspace.dependencies]
# Arrow / Parquet は workspace 全体でバージョンを揃えるため pin する。
# 公開クレート同士で型が共有されるので、ここを統一しないと workspace 内で
# `arrow_array::RecordBatch` の不一致が起こる。
arrow         = "54"
arrow-array   = "54"
arrow-schema  = "54"
parquet       = { version = "54", features = ["arrow"] }

# フォーマット固有
shapefile     = "0.6"
# RFC 7946 GeoJSON / GeoJSONL の Feature・Geometry 型を提供。
# `geo-types` 統合は使わず（shpx-geom::Geom と独立に保つ）、default-features を切る。
geojson       = { version = "0.24", default-features = false }

# GeoPackage ドライバの SQLite アクセス。
# `bundled` 機能は各 driver crate 側で有効化する（cargo-dist の単一バイナリ配布で
# システム libsqlite3 への依存を避けるため。CI に追加 apt パッケージ不要）。
rusqlite      = { version = "0.31", default-features = false }

# FlatGeobuf ドライバ。`default-features = false` で HTTP feature (reqwest) を排除する
# ため、ローカル file I/O 用途のみとなる。geozero は flatgeobuf の必須依存で、
# WKB ↔ FGB geometry の橋渡しに利用するため shpx 側でも明示的に有効化しておく。
flatgeobuf    = { version = "6.0", default-features = false }
geozero       = { version = "0.15", default-features = false, features = ["with-wkb"] }

# CLI / エラー / シリアライズ
clap          = { version = "4.5", features = ["derive", "wrap_help"] }
thiserror     = "1"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# 文字エンコーディング（cpg ファイル経由の DBF 文字列復号に利用）
encoding_rs   = "0.8"

# Driver 静的レジストリ。各 driver crate が `submit!` した entry を
# CLI 起動時に `iter::<DriverRegistration>()` で集約する。
inventory     = "0.3"

# 日時
chrono        = { version = "0.4", default-features = false, features = ["std"] }

# WKT1 (.prj) から EPSG コードを抽出するヒューリスティクスに利用
regex         = "1"

# 座標変換 (`--reproject` / GeoJSON 自動 WGS84)。
# 既定はシステムの libproj を pkg-config で検出する（macOS: `brew install proj`、
# Ubuntu: `apt-get install libproj-dev`）。完全な EPSG 対応と grid shift を確保し
# v0.2 完了基準「4326↔3857 で 1cm 以下」を満たすため。pure Rust 代替 (proj4rs) は
# 対応 CRS のカバレッジが限定的で検証コストが高いと判断した。
#
# 配布バイナリ（cargo-dist）は `shpx-cli` の `bundled-proj` feature を有効化し、
# libproj/SQLite を C ソースから static link して単一バイナリ化する想定。
# default では opt-in しないことで dev ビルドの cmake / clang 要求を回避する。
proj          = { version = "0.28", default-features = false }

# PostGIS ドライバの非同期 PostgreSQL クライアント。`Driver` trait は同期 API なので
# driver crate 内で `tokio` ランタイムを保持し block_on で同期化する。`with-chrono-0_4`
# で chrono::DateTime / NaiveDate を timestamp/date のネイティブ ToSql/FromSql として
# 扱えるようにする。`tokio` の `rt-multi-thread` は `Connection` future を別 task に
# 逃がす必要があるため必須（`current_thread` だと block_on 中に Connection が進まない）。
tokio          = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time"] }
# `runtime` feature は default-features=false でも `Config::connect` を有効化するために必要。
# 切ると低レベルの `connect_raw` しか使えず、tokio runtime 経由の `connect` が消える。
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-chrono-0_4"] }
postgres-types = { version = "0.2", features = ["with-chrono-0_4"] }
bytes          = "1"
futures-util   = { version = "0.3", default-features = false }

# SQL Server driver の async クライアント。`tds73` (SQL Server 2008+) と `rustls`
# (macOS の native TLS は SQL Server 2019+ で TLS handshake が失敗する既知問題があるため
# pure rustls を強制)、`rust_decimal` (tiberius の Numeric write 経路の scale 0 以外で
# のバグ回避)、`chrono` (NaiveDateTime/DateTime<Utc> を datetime2/datetimeoffset へ
# ネイティブ bind) を有効化。`default-features = false` で OS-specific TLS backend を排除。
tiberius       = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal"] }
# tiberius は futures-io ベースの AsyncRead/Write を要求するため、tokio TcpStream を
# `compat()` でブリッジする。
tokio-util     = { version = "0.7", features = ["compat"] }
# tiberius 経由の Decimal128 ↔ T-SQL `decimal(p,s)` 変換に使う。
rust_decimal   = "1"
# staging テーブル名のユニーク suffix。接続スコープ #temp でも衝突回避用。
uuid           = { version = "1", features = ["v4"] }

# ログ
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# テスト用
tempfile      = "3"
assert_cmd    = "2"
predicates    = "3"

# build.rs 用 C コンパイラ呼び出しラッパ。`shpx-driver-spatialite` の
# `bundled-spatialite` で利用。GEOS / PROJ / freexl などの bundled 化で他 driver も
# 引く可能性を見越して workspace dep にしておく。
cc            = "1"

# `bundled-spatialite` で libgeos を CMake 経由で vendor する (`shpx-driver-spatialite/build.rs`)。
geos-src        = "0.2"
# libgeos は C++ 実装。最終バイナリで C++ stdlib を確実にリンクするため direct dep にする。
link-cplusplus  = "1"

[workspace.lints.rust]
# `unsafe` は明示的に許可するモジュール以外で禁止。
unsafe_code = "deny"

[workspace.lints.clippy]
# 既定で広めに warn にし、ノイズが大きい lint は各クレートで個別に allow する。
all     = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic のうち実用上ノイズが大きいものを allow する。
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
# 日本語コメント中の英単語・カタカナを誤検出するため allow。
doc_markdown            = "allow"

[profile.release]
lto       = "thin"
codegen-units = 1
strip     = "debuginfo"
